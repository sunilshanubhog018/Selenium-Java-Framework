# Application URL
base.url=https://parabank.parasoft.com/parabank/

# Browser (chrome / firefox / edge)
browser=edge

# Optional Edge driver path. If unset, uses ./drivers/msedgedriver.exe then WebDriverManager.
# (Selenium Manager 4.27 still hits dead CDN msedgedriver.azureedge.net — local driver avoids that.)
# edge.driver.path=C:/tools/msedgedriver.exe

# Headless mode (true for CI, false for local)
