name: Selenium-Java-Framework CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - smoke

# Needed so CI can commit latest reports back into reports/ci-latest/
permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    # Skip full suite when manual run requested smoke only
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'full'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full history so report commit can push cleanly to main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Show Chrome version
        run: google-chrome --version || chromium --version || true

      - name: Run All Tests
        env:
          CI: true
          # Never wipe the public shared ParaBank database in CI
          PARABANK_INIT_DB: false
        run: mvn clean test -B

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report -B

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: target/site/allure-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ github.run_number }}
          path: test-output/ExtentReport.html
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload TestNG Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports-${{ github.run_number }}
          path: |
            target/surefire-reports/
            test-output/
          retention-days: 30
          if-no-files-found: ignore

      # Save latest CI reports into the repo so they appear under reports/ci-latest/
      # after you run: git pull
      - name: Publish reports into reports/ci-latest
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -e
          DEST="reports/ci-latest"
          rm -rf "$DEST"
          mkdir -p "$DEST/testng" "$DEST/allure" "$DEST/screenshots"

          # Extent
          if [ -f test-output/ExtentReport.html ]; then
            cp test-output/ExtentReport.html "$DEST/ExtentReport.html"
          fi

          # TestNG / Surefire
          if [ -d target/surefire-reports ]; then
            cp -r target/surefire-reports/. "$DEST/testng/"
          fi

          # Allure HTML (if generated)
          if [ -d target/site/allure-report ]; then
            cp -r target/site/allure-report/. "$DEST/allure/" 2>/dev/null || true
          fi

          # Failure screenshots (if any)
          if [ -d test-output/screenshots ]; then
            cp -r test-output/screenshots/. "$DEST/screenshots/" 2>/dev/null || true
          fi

          # Run metadata
          {
            echo "# CI Reports — latest"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Run number | ${{ github.run_number }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | ${{ github.ref_name }} |"
            echo "| Workflow | ${{ github.workflow }} |"
            echo "| UTC time | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo ""
            echo "## Open locally after \`git pull\`"
            echo ""
            echo "- Extent: \`reports/ci-latest/ExtentReport.html\`"
            echo "- TestNG: \`reports/ci-latest/testng/index.html\`"
            echo "- TestNG emailable: \`reports/ci-latest/testng/emailable-report.html\`"
            echo "- Allure: \`reports/ci-latest/allure/index.html\` (if present)"
            echo "- Screenshots: \`reports/ci-latest/screenshots/\`"
          } > "$DEST/README.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Avoid fighting concurrent pushes
          git pull --rebase origin main || true

          git add -A "$DEST"
          if git diff --staged --quiet; then
            echo "No report file changes to commit."
            exit 0
          fi

          git commit -m "ci: publish latest test reports from run #${{ github.run_number }} [skip ci]"
          git push origin HEAD:main
          echo "Reports committed to reports/ci-latest/ on main."

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Execution Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/surefire-reports/testng-results.xml ]; then
            echo "### Surefire results present" >> $GITHUB_STEP_SUMMARY
          fi
          echo "### Reports" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Artifacts (download from Actions UI)" >> $GITHUB_STEP_SUMMARY
          echo "- **Repo folder:** \`reports/ci-latest/\` (auto-committed on main; run \`git pull\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: smoke-tests job runs only on workflow_dispatch with suite=smoke." >> $GITHUB_STEP_SUMMARY

  smoke-tests:
    runs-on: ubuntu-latest
    # Only on manual dispatch with smoke selected (avoids looking "always skipped" on every push)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'smoke'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Smoke Tests
        env:
          CI: true
          PARABANK_INIT_DB: false
        run: mvn clean test -B -Dsurefire.suiteXmlFiles=testng-smoke.xml

      - name: Upload Smoke Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-extent-report-${{ github.run_number }}
          path: test-output/ExtentReport.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Smoke Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports-${{ github.run_number }}
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore
