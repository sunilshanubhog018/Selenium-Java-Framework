name: Selenium-Java-Framework CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - smoke

# Needed so CI can commit latest reports back into reports/ci-latest/
permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    # Skip full suite when manual run requested smoke only
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'full'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full history so report commit can push cleanly to main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Show Chrome version
        run: google-chrome --version || chromium --version || true

      - name: Run All Tests
        env:
          CI: true
          # Never wipe the public shared ParaBank database in CI
          PARABANK_INIT_DB: false
        run: mvn clean test -B

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report -B

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: target/site/allure-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ github.run_number }}
          path: test-output/ExtentReport.html
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload TestNG Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports-${{ github.run_number }}
          path: |
            target/surefire-reports/
            test-output/
          retention-days: 30
          if-no-files-found: ignore

      # Each CI run gets its OWN folder — never overwrites previous runs
      # Layout: reports/ci/run-<number>/  + reports/ci/INDEX.md
      - name: Publish reports (per-run folder, no overwrite)
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -e
          RUN_NO="${{ github.run_number }}"
          DEST="reports/ci/run-${RUN_NO}"
          INDEX="reports/ci/INDEX.md"
          UTC_NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Never delete other run-* folders — only create this run's directory
          mkdir -p "$DEST/testng" "$DEST/allure" "$DEST/screenshots"

          if [ -f test-output/ExtentReport.html ]; then
            cp test-output/ExtentReport.html "$DEST/ExtentReport.html"
          fi

          if [ -d target/surefire-reports ]; then
            cp -r target/surefire-reports/. "$DEST/testng/"
          fi

          if [ -d target/site/allure-report ]; then
            cp -r target/site/allure-report/. "$DEST/allure/" 2>/dev/null || true
          fi

          if [ -d test-output/screenshots ]; then
            cp -r test-output/screenshots/. "$DEST/screenshots/" 2>/dev/null || true
          fi

          # Per-run metadata
          {
            echo "# CI Report — Run #${RUN_NO}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Run number | ${RUN_NO} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | ${{ github.ref_name }} |"
            echo "| Workflow | ${{ github.workflow }} |"
            echo "| Job status | see Actions run #${RUN_NO} |"
            echo "| UTC time | ${UTC_NOW} |"
            echo "| Actions URL | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo ""
            echo "## Open these files"
            echo ""
            echo "- Extent: \`ExtentReport.html\`"
            echo "- TestNG: \`testng/index.html\`"
            echo "- TestNG emailable: \`testng/emailable-report.html\`"
            echo "- Allure: \`allure/index.html\` (if present)"
            echo "- Screenshots: \`screenshots/\`"
          } > "$DEST/README.md"

          # Rebuild index of ALL run folders (newest first)
          mkdir -p reports/ci
          {
            echo "# CI Reports index"
            echo ""
            echo "Each CI run on \`main\` creates a **new** folder under \`reports/ci/run-<number>/\`."
            echo "Previous runs are **never overwritten**."
            echo ""
            echo "After CI finishes, pull reports locally:"
            echo ""
            echo '```bash'
            echo 'git pull'
            echo '```'
            echo ""
            echo "| Run | Folder | When (UTC) | Commit |"
            echo "|-----|--------|------------|--------|"
            # List run-* dirs by number descending
            for d in $(ls -d reports/ci/run-* 2>/dev/null | sort -t- -k2 -nr); do
              name=$(basename "$d")
              num=${name#run-}
              when="—"
              sha="—"
              if [ -f "$d/README.md" ]; then
                when=$(grep -m1 '| UTC time |' "$d/README.md" | sed 's/.*| UTC time | //;s/ |//' || true)
                sha=$(grep -m1 '| Commit |' "$d/README.md" | sed 's/.*| Commit | //;s/ |//;s/`//g' || true)
                [ -z "$when" ] && when="—"
                [ -z "$sha" ] && sha="—"
              fi
              short_sha=$(echo "$sha" | cut -c1-7)
              echo "| #${num} | [\`${name}\`](./${name}/) | ${when} | \`${short_sha}\` |"
            done
            echo ""
            echo "Latest run folder: \`reports/ci/run-${RUN_NO}/\`"
          } > "$INDEX"

          # Pointer file for convenience (text only — does not replace history)
          echo "run-${RUN_NO}" > reports/ci/LATEST.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main || true

          git add -A reports/ci
          if git diff --staged --quiet; then
            echo "No report file changes to commit."
            exit 0
          fi

          git commit -m "ci: add test reports for run #${RUN_NO} [skip ci]"
          git push origin HEAD:main
          echo "Reports saved to reports/ci/run-${RUN_NO}/ (previous runs kept)."

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Execution Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/surefire-reports/testng-results.xml ]; then
            echo "### Surefire results present" >> $GITHUB_STEP_SUMMARY
          fi
          echo "### Reports" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Artifacts (download from Actions UI)" >> $GITHUB_STEP_SUMMARY
          echo "- **Per-run folder:** \`reports/ci/run-${{ github.run_number }}/\` (never overwrites older runs)" >> $GITHUB_STEP_SUMMARY
          echo "- **Index:** \`reports/ci/INDEX.md\`" >> $GITHUB_STEP_SUMMARY
          echo "- After CI: \`git pull\` then open that folder" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: smoke-tests job runs only on workflow_dispatch with suite=smoke." >> $GITHUB_STEP_SUMMARY

  smoke-tests:
    runs-on: ubuntu-latest
    # Only on manual dispatch with smoke selected (avoids looking "always skipped" on every push)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'smoke'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Smoke Tests
        env:
          CI: true
          PARABANK_INIT_DB: false
        run: mvn clean test -B -Dsurefire.suiteXmlFiles=testng-smoke.xml

      - name: Upload Smoke Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-extent-report-${{ github.run_number }}
          path: test-output/ExtentReport.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Smoke Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports-${{ github.run_number }}
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore
